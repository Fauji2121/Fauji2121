<svg xmlns="http://www.w3.org/2000/svg" width="680" height="20" viewBox="0 0 680 20" role="img" aria-label="Pembatas">
  <defs>
    <!-- Garis utama: hijau ke teal, memudar di kedua ujung -->
    <linearGradient id="grad-line" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="640" y2="0">
      <stop offset="0" stop-color="#7df070" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#7df070"/>
      <stop offset="0.7" stop-color="#2dd4d4"/>
      <stop offset="1" stop-color="#2dd4d4" stop-opacity="0"/>
    </linearGradient>

    <!-- Kilau yang bergerak -->
    <linearGradient id="grad-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6fff9" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e6fff9" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#e6fff9" stop-opacity="0"/>
    </linearGradient>

    <!-- Kilau hanya terlihat di atas garis -->
    <clipPath id="clip-line">
      <rect x="40" y="8" width="600" height="4"/>
    </clipPath>
  </defs>

  <style>
    /* Satu putaran = 5 detik: kilau bergerak 3 detik, lalu diam 2 detik */
    @keyframes sweep {
      0%   { transform: translateX(-100px); }
      60%  { transform: translateX(660px); }
      100% { transform: translateX(660px); }
    }
    .glow { animation: sweep 5s ease-in-out infinite; }

    /* Pengunjung yang mengaktifkan "kurangi gerakan" melihat garis diam */
    @media (prefers-reduced-motion: reduce) {
      .glow { animation: none; opacity: 0; }
    }
  </style>

  <!-- Garis -->
  <rect x="40" y="9" width="600" height="2" fill="url(#grad-line)"/>

  <!-- Kilau -->
  <g clip-path="url(#clip-line)">
    <rect class="glow" x="0" y="6" width="100" height="8" fill="url(#grad-glow)"/>
  </g>
</svg>
